spring:
  application:
    name: crm-admin
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crm}
    username: ${DB_USER:crm}
    password: ${DB_PASSWORD:crm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Moscow
  flyway:
    enabled: true
    schemas: notice,callcenter,retention,arch,app
    default-schema: app
    create-schemas: true

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      # Дольше держим сессию; при её истечении вход восстановит remember-me кука.
      timeout: ${SESSION_TIMEOUT:7d}
      cookie:
        # Своё имя на среду (prod/preprod/test на одном хосте) — иначе куки сред затирают друг друга.
        name: ${SESSION_COOKIE:JSESSIONID}
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  # Среда инстанса: prod | preprod | test. Отдаётся фронту через GET /api/env (бейдж в шапке).
  env:
    name: ${APP_ENV:prod}
  # Разделы в разработке (Цепочки и далее) видны только там, где флаг включён (preprod/test).
  features:
    dev: ${FEATURES_DEV:false}
  # First super-admin, created idempotently on startup.
  admin:
    email: ${ADMIN_EMAIL:admin@banki.ru}
    password: ${ADMIN_PASSWORD:admin12345}
  # Restrict login/registration email domain (empty = no restriction).
  email-domain: ${APP_EMAIL_DOMAIN:}
  # Постоянная авторизация (remember-me). Ключ должен быть стабильным между рестартами.
  remember-me:
    key: ${REMEMBER_ME_KEY:crm-admin-remember-me-key-change-me}
    days: ${REMEMBER_ME_DAYS:30}
    cookie-name: ${REMEMBER_COOKIE:crm-remember}
  # Write app.current_user before mutating queries (audit trigger on arch.arch_log).
  audit:
    enabled: true
  # Внешняя прод-БД (схемы notice/callcenter 1:1): очередь app.prod_sync доставляет
  # туда операции мастера. Пусто = синк выключен, очередь копится в PENDING.
  # ETL «прод -> мы»: актуализация нашей копии шаблонов из прод-таблиц.
  # Выключен по умолчанию; молчит, если прод-приёмник не настроен/недоступен.
  etl:
    enabled: ${ETL_ENABLED:false}
    interval-ms: ${ETL_INTERVAL_MS:300000}        # инкремент раз в 5 минут
    overlap-minutes: ${ETL_OVERLAP_MINUTES:0}     # 0: метки в проде выставлены разом, перекрытие тянуло бы всю таблицу
    initial-delay-ms: ${ETL_INITIAL_DELAY_MS:60000}
    full-cron: ${ETL_FULL_CRON:0 0 22 * * *}      # полный прогон в 22:00
  proddb:
    url: ${PROD_DB_URL:}
    user: ${PROD_DB_USER:}
    password: ${PROD_DB_PASSWORD:}
    connect-timeout-ms: ${PROD_DB_CONNECT_TIMEOUT_MS:20000}
  # Цепочки-схемы: по умолчанию в БД (app.journeys, jsonb); true = мок в памяти (dev без БД).
  journeys:
    mock: ${JOURNEYS_MOCK:false}
  # Physical table locations — override per environment without touching code.
  tables:
    push: notice.push_template
    email: notice.email_template
    sms: notice.d_com_sms_template
    cc: callcenter.d_segment_properties
    # журнал действий админки (в проде укажи реальное расположение t_admin_log)
    admin-log: ${ADMIN_LOG_TABLE:arch.t_admin_log}

logging:
  level:
    org.flywaydb: info

---
# Bundled DB for local/dev + demo. Flyway builds the prod-identical schema and seeds demo data.
spring:
  config:
    activate:
      on-profile: docker
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    # Сиды заняли версии V900+; новые схемные миграции (V3, V4, …) выходят «младше» уже
    # применённых — разрешаем применять их задним числом (только dev-БД этого профиля).
    out-of-order: true

---
# Production: connect to the existing corporate PostgreSQL. Tables already exist there,
# so schema migrations are OFF; only baseline validation runs.
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    enabled: false
app:
  audit:
    enabled: true
