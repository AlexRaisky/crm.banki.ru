spring:
  application:
    name: crm-admin
  web:
    resources:
      cache:
        cachecontrol:
          # Статику браузер обязан перепроверять при каждой загрузке.
          #
          # Без этого он кеширует index.html, css и js «на своё усмотрение», и после
          # выката человек видит старую панель: правка есть в образе, есть в ответе
          # сервера, а на экране её нет. Лечилось это Ctrl+F5 — то есть каждый раз
          # приходилось объяснять, что нажать, вместо того чтобы просто работало.
          #
          # no-cache не значит «качать всё заново»: браузер шлёт условный запрос с
          # If-Modified-Since, и на неизменившийся файл сервер отвечает 304 без тела.
          # Для внутренней панели на пару мегабайт статики это ничего не стоит.
          no-cache: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crm}
    username: ${DB_USER:crm}
    password: ${DB_PASSWORD:crm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Moscow
  flyway:
    enabled: true
    schemas: notice,callcenter,retention,arch,app
    default-schema: app
    create-schemas: true

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      # Дольше держим сессию; при её истечении вход восстановит remember-me кука.
      timeout: ${SESSION_TIMEOUT:7d}
      cookie:
        # Своё имя на среду (prod/preprod/test на одном хосте) — иначе куки сред затирают друг друга.
        name: ${SESSION_COOKIE:JSESSIONID}
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  # Среда инстанса: prod | preprod | test. Отдаётся фронту через GET /api/env (бейдж в шапке).
  env:
    name: ${APP_ENV:prod}
  # Разделы в разработке (Цепочки и далее) видны только там, где флаг включён (preprod/test).
  features:
    dev: ${FEATURES_DEV:false}
  # Супер-админы: список почт через запятую, закрепляется на каждом старте.
  admin:
    email: ${ADMIN_EMAIL:admin@banki.ru}
    password: ${ADMIN_PASSWORD:admin12345}
  # Выкатки: адреса соседних контуров во внутренней сети compose, общий секрет для
  # запроса версии и данные для текста команды (ветка и каталог на сервере).
  deploy:
    peers: ${DEPLOY_PEERS:}
    peer-token: ${DEPLOY_PEER_TOKEN:}
    branch: ${DEPLOY_BRANCH:admin-panel}
    dir: ${DEPLOY_DIR:~/crm.banki.ru}
  # Restrict login/registration email domain (empty = no restriction).
  email-domain: ${APP_EMAIL_DOMAIN:}
  # Постоянная авторизация (remember-me). Ключ должен быть стабильным между рестартами.
  remember-me:
    key: ${REMEMBER_ME_KEY:crm-admin-remember-me-key-change-me}
    days: ${REMEMBER_ME_DAYS:30}
    cookie-name: ${REMEMBER_COOKIE:crm-remember}
  # Write app.current_user before mutating queries (audit trigger on arch.arch_log).
  audit:
    enabled: true
  # Внешняя прод-БД (схемы notice/callcenter 1:1): очередь app.prod_sync доставляет
  # туда операции мастера. Пусто = синк выключен, очередь копится в PENDING.
  # ETL «прод -> мы»: актуализация нашей копии шаблонов из прод-таблиц.
  # Выключен по умолчанию; молчит, если прод-приёмник не настроен/недоступен.
  etl:
    enabled: ${ETL_ENABLED:false}
    interval-ms: ${ETL_INTERVAL_MS:300000}        # инкремент раз в 5 минут
    overlap-minutes: ${ETL_OVERLAP_MINUTES:0}     # 0: метки в проде выставлены разом, перекрытие тянуло бы всю таблицу
    initial-delay-ms: ${ETL_INITIAL_DELAY_MS:60000}
    full-cron: ${ETL_FULL_CRON:0 0 22 * * *}      # полный прогон в 22:00
  # Сверка событий с crmdb: частый опрос «что новее нашего последнего id»
  # плюс вечерний полный проход — он подбирает то, что хвост пропустил из-за неприехавших связей.
  event-import:
    # enabled здесь больше нет: выключатель один — строка event-import в
    # «Настройки» → «Переливы» → «Процессы переливов». Свойство перекрывало её и делало
    # экран неправдой.
    interval-ms: ${EVENT_IMPORT_INTERVAL_MS:300000}     # хвост раз в 5 минут
    initial-delay-ms: ${EVENT_IMPORT_INITIAL_DELAY_MS:90000}
    full-cron: ${EVENT_IMPORT_FULL_CRON:0 30 22 * * *}  # полная сверка в 22:30, после ETL шаблонов
    increment-limit: ${EVENT_IMPORT_INCREMENT_LIMIT:500}
    full-limit: ${EVENT_IMPORT_FULL_LIMIT:5000}
  proddb:
    url: ${PROD_DB_URL:}
    user: ${PROD_DB_USER:}
    password: ${PROD_DB_PASSWORD:}
    connect-timeout-ms: ${PROD_DB_CONNECT_TIMEOUT_MS:20000}
    # метки времени в проде пишем/читаем в UTC+3
    time-zone: ${PROD_DB_TIME_ZONE:Europe/Moscow}
  # Цепочки-схемы: по умолчанию в БД (app.journeys, jsonb); true = мок в памяти (dev без БД).
  journeys:
    mock: ${JOURNEYS_MOCK:false}
  # Physical table locations — override per environment without touching code.
  tables:
    push: notice.push_template
    email: notice.email_template
    sms: notice.d_com_sms_template
    cc: callcenter.d_segment_properties
    # журнал действий админки (в проде укажи реальное расположение t_admin_log)
    admin-log: ${ADMIN_LOG_TABLE:arch.t_admin_log}

logging:
  level:
    org.flywaydb: info

---
# Bundled DB for local/dev + demo. Flyway builds the prod-identical schema and seeds demo data.
spring:
  config:
    activate:
      on-profile: docker
  flyway:
    # Сиды (db/seed, версии V900+) ОТКЛЮЧЕНЫ. V900 наполняет notice.*/callcenter.*, а их
    # удаляет V12 — на уже поднятых контурах сид успел примениться раньше V12 и потому
    # прошёл, но на ЧИСТОМ томе Flyway идёт по возрастанию версии: V12 сносит таблицы,
    # V900 (900 > 24) выполняется последним и падает с «relation notice.push_template
    # does not exist» — приложение не стартует. Демо-данные больше не нужны: шаблоны
    # приезжают из прод-БД синком, цепочки заводятся в панели.
    locations: classpath:db/migration
    # Сиды уже записаны в flyway_schema_history поднятых контуров, поэтому после снятия
    # локации Flyway валился бы на «applied migration not resolved locally». Записи о них
    # вычищает FlywaySeedCleanup перед migrate (ignore-migration-patterns тут не годится —
    # шаблон *:missing доступен только в платной редакции Flyway).
    # Схемные миграции временами выходят «младше» уже применённых сидов V900+ —
    # разрешаем применять их задним числом (наследие того же порядка версий).
    out-of-order: true

---
# Production: connect to the existing corporate PostgreSQL. Tables already exist there,
# so schema migrations are OFF; only baseline validation runs.
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    enabled: false
app:
  audit:
    enabled: true
