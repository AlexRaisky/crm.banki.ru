# Домен смотрит ТОЛЬКО на прод-инстанс. Preprod/test через nginx не публикуются —
# доступ к ним по SSH-туннелю:
#   ssh -L 8081:127.0.0.1:8081 -L 8082:127.0.0.1:8082 user@server
#
# ВАЖНО про .env на сервере: пока в нём нет APP_BIND=127.0.0.1, приложения слушают
# 0.0.0.0 и доступны напрямую по 8080/8081/8082 в обход этого конфига. Прод при этом
# открыт дважды: через домен и по :8080. Закрывать — вместе с решением, как тогда
# ходить на тест и препрод (туннель или отдельные имена ниже).
server {
    listen 80;
    server_name _;   # подставь домен, напр. crm.banki.ru

    # Здоровье для мониторинга без прохода в приложение. Content-Type руками не ставим:
    # return с телом уже отдаёт text/plain из default_type, а add_header не заменяет
    # заголовок, а добавляет — получилось бы два Content-Type в одном ответе.
    location = /nginx-health { return 200 "ok\n"; }

    # Панель — это 2.4 МБ скриптов и стилей плюс страницы под 250 КБ, и всё это статика
    # без хешей в именах: кэшировать её надолго нельзя (после выката браузер обязан
    # увидеть новый файл), а вот сжимать нужно. gzip_proxied обязателен: по умолчанию
    # ответы, пришедшие от апстрима, — а у нас все такие, — не сжимаются вовсе.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/javascript application/javascript application/json
               application/xml image/svg+xml;

    location / {
        proxy_pass http://app-prod:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # По умолчанию nginx ходит к апстриму по HTTP/1.0, то есть на каждый запрос
        # открывает Tomcat'у новое соединение. Пустой Connection обязателен: без него
        # заголовок пришёл бы от клиента и мог закрыть соединение сразу.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Терпение nginx ОБЯЗАНО быть больше самого длинного бюджета приложения, иначе гонку
        # выигрывает nginx и пользователь получает свою страницу 504 вместо внятной
        # ошибки. Было ровно 120s — столько же, сколько QUERY_TIMEOUT_S в
        # SmsCheckReportService, причём секундомер nginx стартует раньше: до самого
        # запроса приложение успевает открыть коннект к DWH и нащупать колонку
        # продукта. «ЧЕК СМС траффик» из-за этого падал в HTTP 504, пока запрос ещё
        # считался. Держим запас: 300s против 130s (QUERY_TIMEOUT_S + socketTimeout).
        # Меняете таймаут в приложении — проверьте, что это число всё ещё больше.
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        client_max_body_size 10m;
    }
}
