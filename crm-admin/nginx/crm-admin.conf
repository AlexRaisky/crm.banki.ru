# Домен смотрит ТОЛЬКО на прод-инстанс. Preprod/test наружу не публикуются
# (APP_BIND=127.0.0.1 на сервере) — доступ к ним по SSH-туннелю:
#   ssh -L 8081:127.0.0.1:8081 -L 8082:127.0.0.1:8082 user@server
server {
    listen 80;
    server_name _;   # подставь домен, напр. crm.banki.ru

    # Здоровье для мониторинга без прохода в приложение
    location = /nginx-health { return 200 "ok\n"; add_header Content-Type text/plain; }

    location / {
        proxy_pass http://app-prod:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }
}
